<main>
<header><div class="eyebrow">SKYGUARD / CONSTANT REWRITE / CONCEPT STUDY</div><h1>改写 π：十个方向</h1><p>十个独立的动画概念。统一黑白与暖黄；统一 4.2 秒时轴。点击画面放大，暂停或拖动进度比较细节。</p><p>这里是矢量概念演示，使用示意星场和目标；最终 Godot 版本会绑定真实战斗单位、命中与金币流。你选定方向后再制作游戏效果。</p></header>
<div class="toolbar"><button id="play" type="button">暂停</button><button id="restart" type="button">从头播放</button><label class="sr" for="timeline">动画时间</label><input id="timeline" type="range" min="0" max="4.2" step=".01" value="0"><output id="clock">0.00 / 4.20s</output><span id="stage" class="stage">法则显现</span><label for="speed">速度</label><select id="speed"><option value="1">正常</option><option value=".5">半速</option></select></div>
<section class="grid" id="grid" aria-label="十个动画方案"></section>
<div class="choice"><span>当前选择</span><strong id="selected">尚未选择</strong><button type="button" id="copy">复制选择文字</button></div><p class="notes">选择按钮只记录你的偏好，不会修改游戏。你可以直接在聊天里回复编号，也可以组合两项的起手和打击。所有空间变化均为科幻视觉设计。</p>
</main>

'use strict';
const designs=[
{name:'宇宙校圆',tag:'01 / THE BROKEN CIRCUMFERENCE',desc:'直径保持不变，圆周却被强制缩短。合不上的那段圆弧变成一道贯穿战场的空间裂口。',beats:['一圈巨大的细白圆周浮现，暖黄光点沿圆校验。','被删掉的圆弧成为黑色缺口；裂口跨过目标，轮廓错开。','残余圆弧在远处缓慢合拢，裂口消退。'],tone:'精确、冷静，一眼看懂圆周规则发生错误。'},
{name:'无理数归零',tag:'02 / INFINITY TO THREE',desc:'无限小数成为一条绕过宇宙的光带，被持续抽入一个孤独的「3」。无限被有限吞掉。',beats:['极细的数位光带围绕核心卷起，越来越长。','数字连续收束成3；目标的光被一起抽离。','数字尾迹消散，只剩短暂的空白与一个整数。'],tone:'概念辨识最强，以细长数位带呈现无限感。'},
{name:'测地线重写',tag:'03 / GEODESIC REWRITE',desc:'没有实体武器，整个空间先变得不对劲。星光与飞行轨迹弯向同一处，敌人沿新的最短路径瓦解。',beats:['三束横贯战场的星光逐渐偏折，星场出现柔和流动。','曲率突然统一；目标留下弯曲、错位的光影后消失。','光路恢复，留下几缕延迟抵达的星光。'],tone:'连续、优雅，适合大面积空间失真。'},
{name:'银河解卷',tag:'04 / UNWIND THE GALAXY',desc:'整片银河像被拆掉了曲率。旋臂从紧密螺旋缓缓拉成三条横贯屏幕的星河，天体随之失去完整形态。',beats:['旋臂卷起，星尘沿盘面形成清晰流向。','三条旋臂被拉直、展开到画面之外；目标被解成星尘。','星河拖尾留在深空，然后缓慢散去。'],tone:'尺度最大，强调宇宙结构被改写的震撼。'},
{name:'周长剥离',tag:'05 / THE UNRAVELING EDGE',desc:'每个天体的外缘被抽成一根极细的发光丝。轮廓像剥开的果皮般连续解开，最终只剩空心残影。',beats:['目标边缘出现一条暖黄起点，细线沿轮廓游走。','完整轮廓被剥成长丝；各条长丝向战场外舒展。','长丝渐暗，空心残影像烟一样淡去。'],tone:'精致、直接，让每个真实目标都成为动画主体。'},
{name:'曲率透镜',tag:'06 / THE IMPOSSIBLE LENS',desc:'一枚几乎透明的巨大透镜让后方星河发生弯折。圆周无法闭合时，所有目标的影像突然被拉成一道光弧。',beats:['巨大暗透镜缓慢鼓起，周围星光形成偏折亮边。','透镜边缘翻转；目标影像沿同一光弧拉长并断开。','透镜无声塌平，星光延迟恢复。'],tone:'光学质感与负空间，适合电影式的沉稳压迫感。'},
{name:'周期失配',tag:'07 / DESYNCHRONIZED ORBITS',desc:'不同半径的轨道开始错误地共享同一周期。所有弧光逐渐追上彼此，在三处同时重合，宇宙发生一次无声的失步。',beats:['六条稀疏轨道上的光点改变周期，逐渐锁相。','光点在三个位置同步；目标出现时间错位残像并破碎。','轨道只余三段极细的余光，恢复正常流动。'],tone:'精密、秩序感强，重点是同步前的紧张等待。'},
{name:'空间折返',tag:'08 / RETURNING SPACE',desc:'一条光路穿出屏幕右侧，又从左侧回到原点。战场被接成无法逃出的闭环，敌人的影像不断折返并最终重合。',beats:['两道极细曲面接缝出现，星光开始越过画面边缘。','目标的折返影像叠回自身，沿闭环同时被抹去。','接缝平滑退场，空间恢复原来的距离。'],tone:'诡异、超越尺度，强调连空间边界也失去意义。'},
{name:'三重曲率',tag:'09 / THREEFOLD SPACE',desc:'巨大的圆形空间缓缓长出三个柔和的曲率方向，形成流动的三叶星河。天体在曲面之间被连续错开，像现实正在溶解。',beats:['一条宽阔圆形光流发生三处极缓慢的弯曲。','三个方向同时伸展到场外，目标被拆成柔和光带。','三条曲线分离、远去，残留星尘恢复平静。'],tone:'有机、优雅，避免直角、多边形和机械形变。'},
{name:'静默抹除',tag:'10 / SILENT ERASURE',desc:'所有光先安静下来，只留一条无法闭合的细弧。它被改写成一道直线横过战场，经过的目标只留下极短的空白。',beats:['星场逐渐熄暗，一条孤独细弧保持亮度。','弧线拉直，横贯全场；一次短促局部白光后目标消失。','直线也被抹掉，留一瞬寂静，再恢复星空。'],tone:'最克制，依靠寂静、留白和突然确定的打击制造压迫。'}
];
const W=660,H=400,TAU=Math.PI*2,CX=W/2,CY=H/2,WHITE='#ededed',GOLD='#ffc94d';
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const smooth=(a,b,x)=>{x=clamp((x-a)/(b-a));return x*x*(3-2*x)};
const mix=(a,b,t)=>a+(b-a)*t;
const pseudo=n=>{const v=Math.sin(n*127.1+311.7)*43758.5453;return v-Math.floor(v)};
const stars=Array.from({length:160},(_,i)=>[pseudo(i)*W,pseudo(i+600)*H,.2+pseudo(i+990)*.7]);
const targets=Array.from({length:12},(_,i)=>[120+(i%4)*140,90+Math.floor(i/4)*110,7+pseudo(i+32)*6]);
let time=0,playing=!matchMedia('(prefers-reduced-motion: reduce)').matches,speed=1,last=performance.now(),picked=0,zoomed=-1;
const grid=document.getElementById('grid'),dialog=document.getElementById('zoom');
const contexts=[];
designs.forEach((d,i)=>{
 const card=document.createElement('article');card.className='card';card.dataset.id=i+1;
 card.innerHTML=`<canvas tabindex="0" role="button" aria-label="放大方案${i+1}：${d.name}"></canvas><div class="info"><div class="tag">${d.tag}</div><h2>${String(i+1).padStart(2,'0')} · ${d.name}</h2><p>${d.desc}</p><div class="beats"><div><strong>0–2秒</strong> ${d.beats[0]}</div><div><strong>2秒打击</strong> ${d.beats[1]}</div><div><strong>2–4.2秒</strong> ${d.beats[2]}</div></div><footer><button type="button" class="choose" aria-pressed="false">选择 ${String(i+1).padStart(2,'0')}</button><button type="button" class="enlarge">放大观看</button></footer></div>`;
 grid.append(card);const canvas=card.querySelector('canvas');canvas.width=W;canvas.height=H;contexts.push(canvas.getContext('2d'));
 const open=()=>{zoomed=i;document.getElementById('zoom-title').textContent=`${i+1} · ${d.name}`;document.getElementById('zoom-desc').textContent=d.desc+' '+d.tone;dialog.showModal();};
 canvas.onclick=open;canvas.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}};card.querySelector('.enlarge').onclick=open;
 card.querySelector('.choose').onclick=()=>{picked=i+1;document.querySelectorAll('.card').forEach(c=>{c.classList.toggle('selected',+c.dataset.id===picked);c.querySelector('.choose').setAttribute('aria-pressed',String(+c.dataset.id===picked))});document.getElementById('selected').textContent=`${String(picked).padStart(2,'0')} · ${d.name}`;document.getElementById('copy').textContent='复制选择文字';};
});
const large=document.getElementById('large');large.width=1320;large.height=800;const big=large.getContext('2d');
document.getElementById('close').onclick=()=>dialog.close();dialog.onclose=()=>zoomed=-1;
const play=document.getElementById('play'),timeline=document.getElementById('timeline');play.textContent=playing?'暂停':'播放';
document.getElementById('zoom-replay').onclick=()=>{time=0;playing=true;play.textContent='暂停'};
play.onclick=()=>{playing=!playing;play.textContent=playing?'暂停':'播放'};
document.getElementById('restart').onclick=()=>{time=0;playing=true;play.textContent='暂停'};
timeline.oninput=()=>{time=+timeline.value;playing=false;play.textContent='播放';renderAll()};
document.getElementById('speed').onchange=e=>speed=+e.target.value;
document.getElementById('copy').onclick=async()=>{if(!picked){document.getElementById('copy').textContent='先选择一个方向';return}const text=`我选方案${picked}：${designs[picked-1].name}。`;try{await navigator.clipboard.writeText(text);document.getElementById('copy').textContent='已复制，粘贴到聊天即可'}catch{document.getElementById('copy').textContent=`聊天回复：我选${picked}号`}};
function line(c,points,col=WHITE,alpha=1,width=1){if(points.length<2||alpha<=0)return;c.globalAlpha=alpha;c.strokeStyle=col;c.lineWidth=width;c.beginPath();points.forEach((p,i)=>i?c.lineTo(...p):c.moveTo(...p));c.stroke();c.globalAlpha=1}
function dot(c,x,y,r=2,col=WHITE,alpha=1){c.globalAlpha=alpha;c.fillStyle=col;c.beginPath();c.arc(x,y,Math.max(.05,r),0,TAU);c.fill();c.globalAlpha=1}
function arc(c,x,y,r,start=0,end=TAU,col=WHITE,alpha=1,width=1){c.globalAlpha=alpha;c.strokeStyle=col;c.lineWidth=width;c.beginPath();c.arc(x,y,Math.max(.01,r),start,end);c.stroke();c.globalAlpha=1}
function text(c,s,x,y,size=13,col=WHITE,alpha=1){c.globalAlpha=alpha;c.fillStyle=col;c.font=`${size}px monospace`;c.textAlign='center';c.fillText(s,x,y);c.globalAlpha=1}
function glow(c,x,y,r,alpha=.2){const g=c.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,`rgba(237,237,237,${alpha})`);g.addColorStop(1,'rgba(237,237,237,0)');c.fillStyle=g;c.fillRect(x-r,y-r,r*2,r*2)}
function base(c,t,kind){c.fillStyle='#060607';c.fillRect(0,0,W,H);let dim=1;if(kind===9)dim=1-smooth(.15,1.9,t)*.96;if(kind===5)dim=.6;for(const [x,y,v] of stars)dot(c,x,y,v,WHITE,v*dim*.37);arc(c,CX,CY,65,0,TAU,WHITE,.12);arc(c,CX,CY,128,0,TAU,WHITE,.08);dot(c,CX,CY,3,GOLD,.85);text(c,'π  →  3',CX,36,17,WHITE,.65);text(c,'CONSTANT REWRITE',CX,H-20,9,WHITE,.22)}
function bodies(c,t,warp=p=>p){const fade=1-smooth(2,2.3,t);for(let i=0;i<targets.length;i++){let [x,y,r]=targets[i];[x,y]=warp([x,y],i);glow(c,x,y,r*2.4,.08*fade);arc(c,x,y,r,0,TAU,WHITE,.8*fade);dot(c,x+r*.25,y-r*.2,1.8,WHITE,.8*fade)}}
function fragments(c,t,mode='out'){const age=t-2;if(age<0)return;const alpha=(1-smooth(2.6,4.2,t))*.72;for(let i=0;i<targets.length;i++){const [x,y]=targets[i];for(let j=0;j<4;j++){const a=pseudo(i*17+j)*TAU;let nx=x+Math.cos(a)*age*35,ny=y+Math.sin(a)*age*35;if(mode==='in'){nx=mix(x,CX,smooth(2,3.7,t));ny=mix(y,CY,smooth(2,3.7,t))}if(mode==='curve'){nx=x+age*62;ny=y+Math.sin(age*2+i)*age*26}line(c,[[nx-3,ny],[nx+3,ny]],WHITE,alpha*(.3+pseudo(j+i)),.8)}}}
function effect(c,t,i){base(c,t,i);const q=smooth(.15,2,t),after=Math.max(0,t-2),fade=1-smooth(3,4.2,t),hit=Math.exp(-after*13)*(t>=2?1:0);
 switch(i){
 case 0:{bodies(c,t);const r=mix(30,155,smooth(0,.7,t)),gap=.28318*q,a=-Math.PI/2;glow(c,CX,CY,r+20,.07*fade);arc(c,CX,CY,r,a+gap/2,a+TAU-gap/2,WHITE,.83*fade,1.5);line(c,[[CX-r,CY],[CX+r,CY]],WHITE,.3*fade);const p=a+TAU*q;dot(c,CX+Math.cos(p)*r,CY+Math.sin(p)*r,3,GOLD,fade);if(t>1.1){const len=mix(0,440,smooth(1.1,2.25,t));line(c,[[CX,CY-len/2],[CX+gap*70,CY+len/2]],WHITE,fade*(.5+hit*.5),1.3);text(c,'C / d = 3',CX,CY+185,12,GOLD,fade)}fragments(c,t);break}
 case 1:{bodies(c,t,p=>[mix(p[0],CX,q*.15),mix(p[1],CY,q*.15)]);for(let j=0;j<100;j++){const phase=j*.17+t*.85,a=phase*1.6,r=mix(190-j*.8,12,q);const x=CX+Math.cos(a)*r,y=CY+Math.sin(a)*r*.75;const alpha=(1-q*.85)*(.22+j/140)*fade;text(c,'141592653589793238462643383279'[j%28],x,y,9, j%9===0?GOLD:WHITE,alpha)}glow(c,CX,CY,110,.1+hit*.18);text(c,'3',CX,CY+18,mix(22,62,q),WHITE,fade);fragments(c,t,'in');break}
 case 2:{const warp=(p)=>{const x=p[0]-CX,y=p[1]-CY;return [p[0]+Math.sin(y/85)*q*42,p[1]+Math.sin(x/100)*q*58]};for(let j=0;j<3;j++){const points=[];for(let k=0;k<=100;k++){const x=k/100*W,y=100+j*100;points.push(warp([x,y]))}line(c,points,j===1?GOLD:WHITE,(.3+hit*.5)*fade, j===1?1.4:1)}for(const [x,y,v] of stars){const p=warp([x,y]);dot(c,...p,v,WHITE,v*.5*fade)}bodies(c,t,warp);fragments(c,t,'curve');break}
 case 3:{const u=smooth(.65,2.15,t);for(let arm=0;arm<3;arm++){for(let j=0;j<220;j++){const n=j/220,a=n*TAU*1.6+arm*TAU/3+t*.05,r=25+n*175;const x=mix(CX+Math.cos(a)*r,-60+n*(W+120),u),y=mix(CY+Math.sin(a)*r*.65,90+arm*110+Math.sin(n*4+arm)*30,u);dot(c,x,y,.7+pseudo(j)*.7,arm===1&&j%10===0?GOLD:WHITE,(.16+pseudo(j+arm)*.65)*fade)}const p=[];for(let j=0;j<100;j++){const n=j/99,a=n*TAU*1.6+arm*TAU/3+t*.05,r=25+n*175;p.push([mix(CX+Math.cos(a)*r,-60+n*(W+120),u),mix(CY+Math.sin(a)*r*.65,90+arm*110+Math.sin(n*4+arm)*30,u)])}line(c,p,WHITE,.22*fade)}bodies(c,t);fragments(c,t,'curve');break}
