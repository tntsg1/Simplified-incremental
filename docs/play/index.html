<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>天穹防线 · SKYGUARD</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#141414}canvas{display:block;width:100%;height:100%;outline:none;touch-action:none}</style></head><body><canvas id="canvas" tabindex="0"></canvas><script>const openDB=indexedDB.open.bind(indexedDB);indexedDB.open=(name,...args)=>openDB(name==='/userfs'?'/userfs-skyguard':name,...args);</script><script src="index.js"></script><script>
const GODOT_CONFIG={"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":5459596,"index.wasm":39509339},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};const canvas=document.getElementById('canvas');const embedded=parent!==window;function post(d){if(embedded)parent.postMessage({src:'skyguard-shell',...d},location.origin)}window.SkyguardBridge={commands:[],take(){return this.commands.length?JSON.stringify(this.commands.shift()):null},ready(){post({type:'ready'})},started(){post({type:'started'});canvas.focus()},save(text){post({type:'save',text:String(text)})},home(){post({type:'home'})}};const cfg={...GODOT_CONFIG,canvas,canvasResizePolicy:2,onProgress:(loaded,total)=>post({type:'progress',loaded,total}),onExit:()=>post({type:'exit'})};const engine=new Engine(cfg);const exe=cfg.executable||'index',pack=cfg.mainPack||exe+'.pck';let started=false;let loading;const missing=Engine.getMissingFeatures({threads:false});if(missing.length)loading=Promise.reject(new Error('浏览器缺少 '+missing.join('、')));else loading=Promise.all([engine.init(exe),engine.preloadFile(pack,pack)]);loading.catch(error=>post({type:'error',message:String(error.message||error)}));function start(command){window.SkyguardBridge.commands.push(command);if(started)return;started=true;loading.then(()=>engine.start({args:['--main-pack',pack]})).catch(error=>post({type:'error',message:String(error.message||error)}))}addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==parent||e.data?.src!=='skyguard-home')return;if(e.data.type==='start')start(e.data.command);if(e.data.type==='command'){if(!started)start(e.data.command);else window.SkyguardBridge.commands.push(e.data.command)}});if(embedded)post({type:'shell'});else start({action:'new',settings:{}});
</script></body></html>
